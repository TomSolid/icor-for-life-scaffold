# The release, on a pushed version tag. Never on a push to main.
#
# A push to main only lands code (Tom decisions r7k and t5m, 2026-09-07).
# A release starts with the maintainer pushing a bare tag equal to
# .icor-for-life/VERSION on a commit that is on main, after Flint's
# review-before-ship read. The tag is made by hand, never by this workflow.
# The tagged commit that passes the gates becomes a GitHub release and three
# assets, and the member download on app.myicor.com follows
#   https://github.com/<this repo>/releases/latest/download/icor-for-life-obsidian-edition.zip
# (or the versioned copy beside it) with no deploy, no store and no pointer
# anywhere else. Nothing here holds a secret: the run token can write this
# repository's releases and read the public plugin repositories the zip is
# built from, and that is all it needs.
#
# Order matters and is deliberate:
#   1. every gate runs BEFORE anything is published: the tag equals VERSION
#      and sits on main, the checks, the release notes, and a full dry run of
#      the builder against a throwaway clone of the tagged commit. A red
#      publishes nothing; the tag stays where the maintainer put it, and a
#      tag never moves, so a red that needs a code change costs a bump.
#   2. the real zip is built from the TAG on GitHub, not from main, so a
#      second push landing while this runs cannot leak into a zip published
#      under this version, and the tag is asserted to be this commit.
#   3. the release is created as a DRAFT, its assets are uploaded and their
#      digests read back, and only then is it published as latest. Latest
#      never points at a release without its assets, not even for a second.
#   4. an asset is never replaced. Same version, different bytes is a failure.
#   5. the run is green only after the public URLs were downloaded and the
#      bytes compared with the zip that was built.
#
# Every step is idempotent: a red after the tag exists is re-run with
# workflow_dispatch on main (the tag must already exist at that commit; the
# dispatch never creates one) and picks up where it stopped. This file is
# stripped from the member download by the builder's residue gate, like the
# builder itself.
#
# THE SPLIT (plan step 12, 2026-09-24). The team half now lives in the myPKA
# repository, and with it the tools this release needs: the red-test suite,
# the gate that runs it, zip-staged-tree.sh, the disjoint check and the
# version-bump check. They come from ONE myPKA checkout at a pinned tag,
# verified against a pinned commit (a tag can be moved; a sha cannot), and
# that tag must be myPKA's latest release. Bump MYPKA_PIN and MYPKA_PIN_SHA
# together, in their own commit. Written in the lab, where it cannot run (no
# remote, g5w); the pins are set at step 18.
#
# Step 13: myPKA lives in myICOR/myPKA (Marshall M5) and tags with a leading
# v (M3), so the pin is v6.0.1; ICOR keeps bare tags. GH_TOKEN is set only on
# the steps that call gh (Vex F6), never for the whole job.
#
# Step 18 (Vex P7, Marshall H2): build-provenance attestations. The zip and
# the manifest are attested after the build and before the draft, verified at
# once (a one-byte-changed copy must FAIL the same command), and verified
# again after publishing, on the bytes the public URLs serve, with the
# member's own command. Only a TAG build counts (--source-ref refs/tags/...):
# a workflow_dispatch re-run completes a release only when the tag run of the
# same bytes got as far as its attestation. The member command (also in the
# README and in myPKA's mypka-update.py usage text):
#   gh attestation verify icor-for-life-obsidian-edition-<version>.zip \
#     --repo myICOR/icor-for-life-scaffold \
#     --signer-workflow myICOR/icor-for-life-scaffold/.github/workflows/release.yml \
#     --source-ref refs/tags/<version> --deny-self-hosted-runners
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  # Build-provenance attestations (P7): the OIDC token that Sigstore signs
  # with, and the write to this repository's attestation store.
  id-token: write
  attestations: write

# Two pushes never race for the same tag or release. The second waits for the
# first; it is not cancelled, because a cancelled release is a half release.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  ASSET_STEM: icor-for-life-obsidian-edition
  SCRIPTS: 06 AI Team/AI Team Knowledge/Scripts
  MYPKA_REPO: myICOR/myPKA
  MYPKA_PIN: 'v6.0.3'
  MYPKA_PIN_SHA: 'fc008a6029936023d2b518bdd56ff997ea2e9eb9'

defaults:
  run:
    shell: bash

jobs:
  release:
    # A pushed version tag, or a workflow_dispatch re-run on main. A dispatch
    # from any other branch must not be able to publish.
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit with its history and tags
        # actions/checkout v7.0.1, pinned to the commit. The manifest check
        # and the red tests read the tag history, so the whole history comes
        # along. No credentials are left in the checkout: the tag below is
        # created through the API with the run token, not with git push.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          v="$(tr -d '[:space:]' < .icor-for-life/VERSION)"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.icor-for-life/VERSION is not MAJOR.MINOR.PATCH: '$v' (a pre-release tag such as -lab never ships)"
            exit 1
          fi
          # Never below the newest tag that exists. Equal is allowed (a re-run
          # on the tagged commit); the tag step decides whether it is the
          # same commit.
          newest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::VERSION $v is below the newest existing tag $newest"
            exit 1
          fi
          # The tag is the version. On a tag push the two must be equal; on a
          # dispatch re-run the tag must already exist (checked below).
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not equal .icor-for-life/VERSION $v"
            exit 1
          fi
          # And the commit is on main. A tag on a stray commit publishes nothing.
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v at $GITHUB_SHA, on main (newest existing tag: ${newest:-none})"

      - name: Check out myPKA at the pinned tag, and prove the pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch "$MYPKA_PIN" "https://github.com/$MYPKA_REPO.git" "$RUNNER_TEMP/mypka"
          got="$(git -C "$RUNNER_TEMP/mypka" rev-parse HEAD)"
          if [ "$got" != "$MYPKA_PIN_SHA" ]; then
            echo "::error::myPKA tag $MYPKA_PIN is $got, the pin says $MYPKA_PIN_SHA. A moved tag is not the tree this release is tested against."
            exit 1
          fi
          latest="$(gh api "repos/$MYPKA_REPO/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$MYPKA_PIN" ]; then
            echo "::error::myPKA's latest release is $latest, the pin is $MYPKA_PIN. The vendored noteio-icor.py must equal the latest upstream: sync it, bump the pin."
            exit 1
          fi
          echo "myPKA $MYPKA_PIN at $got (latest release)"

      # REQUIRED GATES. Each one exits non-zero on its red; none is optional.
      - name: Gate 1, the manifest describes this tree and the vendored copy equals upstream
        run: python3 "$SCRIPTS/build-scaffold-manifest.py" --check --upstream "$RUNNER_TEMP/mypka"

      - name: Gate 1c, no open decision bracket in a tracked file
        run: |
          # A bracket that opens with a C-number or a three-character decision
          # code, a colon and a space holds a fact only Tom gives (the security
          # contact, an owner, a date). Marshall replaces it; the release waits.
          # git grep reads the tracked files of this work tree: exit 0 is a hit,
          # 1 is none, anything else could not run, and that is never a pass.
          set +e
          git grep -nIE '\[C[0-9]+: |\[[a-z0-9]{3}: '
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::open decision bracket(s) above; the release waits until each is replaced"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::the bracket scan could not run (git grep exit $rc)"
            exit 1
          fi
          echo "OK no open decision bracket in a tracked file"

      - name: Gate 2, no shipped file changed without a VERSION bump and a changelog section
        run: python3 "$RUNNER_TEMP/mypka/$SCRIPTS/check-version-bump.py" --product icor --root . --base auto

      - name: Gate 3, ICOR for Life and myPKA ship disjoint paths
        run: python3 "$RUNNER_TEMP/mypka/$SCRIPTS/check-disjoint.py" "$RUNNER_TEMP/mypka/.mypka/manifest.json" .icor-for-life/manifest.json

      - name: Gate 4, the content structure is valid
        run: python3 "$SCRIPTS/validate-scaffold.py"

      - name: Gate 5, every guard goes red, on a mode A merge with the pinned myPKA
        run: |
          a="$RUNNER_TEMP/modeA"
          mkdir -p "$a"
          ( tar -c --exclude=.git . ) | tar -x -C "$a"
          ( cd "$RUNNER_TEMP/mypka" && tar -c --exclude=.git . ) | tar -x -C "$a"
          ( cd "$a" && python3 "$SCRIPTS/run-red-tests.py" )

      - name: Release notes are this version's section of the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" ".icor-for-life/CHANGELOG.md" "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          version, changelog, out = sys.argv[1:4]
          lines = open(changelog, encoding="utf-8").read().splitlines()
          body, inside = [], False
          for line in lines:
              m = re.match(r"^##\s+\[?(\d+\.\d+\.\d+)\]?", line)
              if m:
                  if inside:
                      break
                  inside = m.group(1) == version
                  continue
              if inside:
                  body.append(line)
          text = "\n".join(body).strip("\n")
          if not text:
              sys.exit(f"FAIL CHANGELOG.md has no '## {version}' section with content")
          open(out, "w", encoding="utf-8").write(text + "\n")
          print(f"release notes: {len(body)} lines from the {version} section")
          PY

      - name: Check the tag (a tag never moves)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Branch on the exit status, not on the output: a missing ref is a
          # 404 whose error body gh prints to STDOUT, so "empty output" would
          # never be true and every first release would fail as "tag exists".
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" \
               --jq '.object.sha + " " + .object.type' 2>/dev/null)"; then
            sha="${existing% *}"
            type="${existing#* }"
            if [ "$type" = "tag" ]; then
              sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
            fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::tag $VERSION already exists at $sha and this push is $GITHUB_SHA. A tag never moves: bump VERSION, write its changelog section, rebuild the manifest, push again."
              exit 1
            fi
            echo "tag $VERSION points at this commit"
          else
            echo "::error::tag $VERSION does not exist on GitHub. A release starts with a pushed tag; this workflow never creates one."
            exit 1
          fi

      - name: Dry run of the builder against this commit, before anything is published
        id: dryrun
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ICOR_SCAFFOLD_TAG: ${{ steps.version.outputs.version }}
          ICOR_SCAFFOLD_GIT: ${{ runner.temp }}/dry/mirror.git
          ICOR_SCAFFOLD_REMOTE: ${{ runner.temp }}/dry/remote.git
          MYPKA_TREE: ${{ runner.temp }}/mypka
        run: |
          # A throwaway bare clone of the checkout at the pushed sha, carrying
          # the tag this run is about to create. The builder stages from it
          # exactly as it will from GitHub, through every gate it has, so a
          # red here costs nothing: no tag, no release, nothing to undo.
          mkdir -p "$RUNNER_TEMP/dry/out"
          git clone --quiet --bare "$GITHUB_WORKSPACE" "$ICOR_SCAFFOLD_REMOTE"
          # On a tag push the checkout is detached with no local main, and a
          # bare clone copies local heads and tags only, never the
          # remote-tracking refs. So the throwaway remote would have no
          # refs/heads/main, and the builder's mirror refresh fetches exactly
          # that ref before it stages anything (run 34107157719, the 1.11.2
          # tag: "fatal: couldn't find remote ref refs/heads/main"). The
          # version step above proved this commit is on main, so main is set
          # to it here; the builder stages the tag, not main, either way.
          git --git-dir "$ICOR_SCAFFOLD_REMOTE" update-ref refs/heads/main "$GITHUB_SHA"
          git --git-dir "$ICOR_SCAFFOLD_REMOTE" \
            -c user.name="release workflow" -c user.email="release@localhost" \
            tag -f -a "$VERSION" -m "ICOR for Life Scaffold $VERSION" "$GITHUB_SHA"
          bash "$SCRIPTS/build-release-zip.sh" "$RUNNER_TEMP/dry/out"
          dry="$(ls "$RUNNER_TEMP/dry/out"/ICOR-for-Life-Scaffold-*.zip)"
          sha="$(sha256sum "$dry" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "zip=$dry" >> "$GITHUB_OUTPUT"
          echo "dry run built $dry ($(stat -c %s "$dry") bytes, sha256 $sha)"

      - name: Build the member zip from the tag on GitHub, through every gate
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_SHA: ${{ steps.dryrun.outputs.sha256 }}
          ICOR_SCAFFOLD_TAG: ${{ steps.version.outputs.version }}
          # Pinned on purpose: this build stages from THIS repository on
          # GitHub, into a fresh mirror, whatever the builder's defaults are.
          ICOR_SCAFFOLD_REMOTE: https://github.com/${{ github.repository }}.git
          ICOR_SCAFFOLD_GIT: ${{ runner.temp }}/scaffold.git
          MYPKA_TREE: ${{ runner.temp }}/mypka
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          bash "$SCRIPTS/build-release-zip.sh" "$out"
          zip="$(ls "$out"/ICOR-for-Life-Scaffold-*.zip)"
          [ -f "$zip" ] || { echo "::error::the builder produced no zip"; exit 1; }

          # The tag the builder staged from is this commit, on GitHub.
          tagged="$(git --git-dir "$ICOR_SCAFFOLD_GIT" rev-parse "$VERSION^{commit}")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::tag $VERSION on GitHub is $tagged, this run is $GITHUB_SHA"
            exit 1
          fi

          # What the builder does not look at: the zip itself.
          if unzip -Z1 "$zip" | grep -qE '^\.github/|build-release-zip\.sh$'; then
            echo "::error::the zip carries build tooling:"
            unzip -Z1 "$zip" | grep -E '^\.github/|build-release-zip\.sh$'
            exit 1
          fi
          inside="$(unzip -p "$zip" .icor-for-life/VERSION | tr -d '[:space:]')"
          if [ "$inside" != "$VERSION" ]; then
            echo "::error::the zip says version '$inside', the tag is $VERSION"
            exit 1
          fi
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          # Same tag, same plugin releases, same bytes as the dry run minutes
          # ago. A difference means something moved under this run.
          if [ "$sha" != "$DRY_SHA" ]; then
            echo "::error::the zip built from the tag ($sha) differs from the dry run ($DRY_SHA)"
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "built $zip ($(stat -c %s "$zip") bytes, sha256 $sha, version $inside, tag at $tagged)"

      # DIAGNOSTIC. The reproducibility comparison in the step above went red
      # twice on this runner while the same builder was byte-stable on the
      # maintainer's Mac (runs 34908775429 and 34909448512, four distinct zip
      # hashes, the two dry runs two bytes apart in SIZE). Reasoning about
      # which byte moved without holding both files is what cost the hour, so
      # both zips and both entry listings (per-entry CRC and size) are kept as
      # run artefacts on EVERY run, red or green, and diffed here in the log.
      - name: Keep both zips and their entry listings, and diff them
        if: always()
        env:
          DRY_ZIP: ${{ steps.dryrun.outputs.zip }}
        run: |
          d="$RUNNER_TEMP/diag"
          mkdir -p "$d"
          listing() {  # $1 zip  $2 label
            [ -f "$1" ] || { echo "no $2 zip at '$1'"; return 0; }
            cp "$1" "$d/$2.zip"
            # -v is the verbose listing: length, method, size, ratio, date,
            # time, CRC-32, name. One line per entry, so a plain diff names
            # the entry that moved and says whether it moved in content
            # (CRC), in size, or only in order.
            unzip -v "$1" > "$d/$2-listing.txt"
            echo "$2: $(stat -c %s "$1") bytes, sha256 $(sha256sum "$1" | cut -d' ' -f1), $(unzip -Z1 "$1" | wc -l) entries"
          }
          listing "$DRY_ZIP" dry
          listing "$(ls "$RUNNER_TEMP/release"/ICOR-for-Life-Scaffold-*.zip 2>/dev/null | head -1)" tag
          if [ -f "$d/dry-listing.txt" ] && [ -f "$d/tag-listing.txt" ]; then
            echo "--- entry listing diff (dry vs tag) ---"
            diff "$d/dry-listing.txt" "$d/tag-listing.txt" || true
            echo "--- end of diff ---"
          fi

      - name: Upload both zips and their entry listings for diffing
        if: always()
        # actions/upload-artifact v7.0.1, pinned to the commit.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-zips-and-listings
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
          retention-days: 7

      - name: Attest the build provenance of the zip and the manifest (P7)
        # actions/attest-build-provenance v4.2.2, pinned to the commit (the
        # same pin as myPKA's). Both public zip names are these bytes, so one
        # subject covers both; manifest.json is published as an asset too.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ steps.build.outputs.zip }}
            .icor-for-life/manifest.json

      - name: Verify the attestation before anything is published, and watch a changed byte fail it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$VERSION" --deny-self-hosted-runners
          }
          verify "$ZIP"
          verify .icor-for-life/manifest.json
          # Negative control (GL-070), on every run: one byte changed after
          # the attestation must fail the same command.
          cp "$ZIP" "$RUNNER_TEMP/one-byte-changed.zip"
          python3 -c 'import sys; p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[len(b) // 2] ^= 0xFF; open(p, "wb").write(b)' "$RUNNER_TEMP/one-byte-changed.zip"
          if verify "$RUNNER_TEMP/one-byte-changed.zip" >/dev/null 2>&1; then
            echo "::error::a zip with one byte changed passed gh attestation verify; the check proves nothing"
            exit 1
          fi
          echo "attestation verified; a one-byte-changed copy is refused"

      - name: Create the release as a draft if it does not exist
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `gh release view` finds drafts too; the tag-based REST lookup
          # does not, which is why the release id is what every later step
          # addresses.
          if ! id="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null)"; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "ICOR for Life Scaffold $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
            id="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
            echo "created draft release $VERSION (id $id)"
          else
            echo "release $VERSION exists (id $id, draft: $(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .draft))"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Upload the assets and read their digests back (never replace an asset with different bytes)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          ZIP: ${{ steps.build.outputs.zip }}
          SHA: ${{ steps.build.outputs.sha256 }}
        run: |
          digest_of() {  # $1 asset name -> "sha256:..." | "nodigest" | ""
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq ".assets[] | select(.name == \"$1\") | (.digest // \"nodigest\")"
          }
          upload() {  # $1 local file  $2 asset name  $3 expected sha256
            local file="$1" name="$2" want="$3" published have
            published="$(digest_of "$name")"
            if [ -n "$published" ]; then
              have="${published#sha256:}"
              if [ "$have" = "$want" ]; then
                echo "$name is already on release $VERSION with these bytes"
                return 0
              fi
              echo "::error::$name is already on release $VERSION with different bytes (published $have, built $want). A version name never changes bytes: bump VERSION and push again."
              exit 1
            fi
            cp "$file" "$RUNNER_TEMP/$name"
            gh release upload "$VERSION" "$RUNNER_TEMP/$name" --repo "$GITHUB_REPOSITORY"
            # Read back: the release carries the digest of what it received.
            for attempt in 1 2 3 4 5 6; do
              published="$(digest_of "$name")"
              [ "${published#sha256:}" = "$want" ] && { echo "uploaded $name, digest read back matches"; return 0; }
              sleep 5
            done
            echo "::error::$name uploaded but its digest read back as '${published:-missing}', expected sha256:$want"
            exit 1
          }
          upload "$ZIP" "$ASSET_STEM.zip" "$SHA"
          upload "$ZIP" "$ASSET_STEM-$VERSION.zip" "$SHA"
          upload ".icor-for-life/manifest.json" "manifest.json" "$(sha256sum .icor-for-life/manifest.json | cut -d' ' -f1)"

      - name: Publish the release as latest, now that its assets are verified
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "release $VERSION published (draft: $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft))"

      - name: Verify the public URLs serve the bytes just built
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.build.outputs.sha256 }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$ASSET_STEM.zip"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            location="$(curl -sI "$url" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')"
            code="$(curl -sSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/roundtrip.zip" -w '%{http_code}' "$url" || true)"
            got="$(sha256sum "$RUNNER_TEMP/roundtrip.zip" 2>/dev/null | cut -d' ' -f1)"
            if [ "$code" = "200" ] && [ "$got" = "$SHA" ] \
               && [[ "$location" == *"/releases/download/$VERSION/"* ]]; then
              ok=1
              break
            fi
            echo "attempt $attempt: http $code, location '$location', sha256 ${got:-none}; waiting"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::$url does not serve the zip built for $VERSION (last: http $code, location '$location', sha256 ${got:-none} vs built $SHA)"
            exit 1
          fi
          size="$(stat -c %s "$RUNNER_TEMP/roundtrip.zip")"
          inside="$(unzip -p "$RUNNER_TEMP/roundtrip.zip" .icor-for-life/VERSION | tr -d '[:space:]')"
          echo "latest-release URL serves $VERSION: $size bytes, sha256 $SHA, VERSION inside the zip $inside"

          # The versioned copy is what the member app redirects to whenever it
          # knows the version (the folder the member unzips is named after the
          # file), so it is verified the same way. Same bytes, or the run is red.
          vurl="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$ASSET_STEM-$VERSION.zip"
          vcode="$(curl -sSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/roundtrip-versioned.zip" -w '%{http_code}' "$vurl" || true)"
          vgot="$(sha256sum "$RUNNER_TEMP/roundtrip-versioned.zip" 2>/dev/null | cut -d' ' -f1)"
          if [ "$vcode" != "200" ] || [ "$vgot" != "$SHA" ]; then
            echo "::error::$vurl does not serve the zip built for $VERSION (http $vcode, sha256 ${vgot:-none} vs built $SHA)"
            exit 1
          fi
          echo "versioned URL serves the same bytes: $vurl"

          # And the manifest asset is this commit's manifest.
          murl="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/manifest.json"
          mwant="$(sha256sum .icor-for-life/manifest.json | cut -d' ' -f1)"
          mcode="$(curl -sSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/roundtrip-manifest.json" -w '%{http_code}' "$murl" || true)"
          mgot="$(sha256sum "$RUNNER_TEMP/roundtrip-manifest.json" 2>/dev/null | cut -d' ' -f1)"
          if [ "$mcode" != "200" ] || [ "$mgot" != "$mwant" ]; then
            echo "::error::$murl does not serve this commit's manifest (http $mcode, sha256 ${mgot:-none} vs $mwant)"
            exit 1
          fi
          echo "manifest asset serves this commit's manifest: $murl"
          {
            echo "## ICOR for Life Scaffold $VERSION"
            echo
            echo "- download: $url"
            echo "- resolves to: $location"
            echo "- versioned: $vurl"
            echo "- manifest: $murl (sha256 $mwant)"
            echo "- size: $size bytes"
            echo "- sha256: $SHA"
            echo "- version inside the zip: $inside"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the attestation of what the public URLs serve, with the member's command (P7)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$VERSION" --deny-self-hosted-runners
          }
          # The three files the previous step downloaded from the public URLs.
          verify "$RUNNER_TEMP/roundtrip.zip"
          verify "$RUNNER_TEMP/roundtrip-versioned.zip"
          verify "$RUNNER_TEMP/roundtrip-manifest.json"
          echo "the public downloads of $VERSION verify: built by this workflow, from this tag, on a GitHub-hosted runner"
